name: TestFlight

# Archives the app and uploads it to App Store Connect / TestFlight.
# Trigger: push a commit whose message contains "[testflight]", or run manually from the Actions tab
# (manual runs need this file on the default branch).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID      10-character Apple Developer Team ID
#   APP_BUNDLE_ID      bundle id of the app record in App Store Connect (e.g. com.yourname.motionlexicon)
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      App Store Connect API issuer ID
#   ASC_KEY_P8         full contents of the AuthKey_XXXX.p8 file (Admin role, so Xcode can manage signing)

on:
  push:
  workflow_dispatch:

jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    # Xcode 27.1 or newer is required for iPhone Duo: apps built with an older SDK are kept clear of the
    # Duo's status-bar strip instead of running to the screen edge. The xcode-27 image carries 27.1.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for v in TEAM_ID BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::Missing secret ASC_KEY_P8"; missing=1; fi
          exit $missing

      - name: Select Xcode
        run: |
          # Pinned to the release 27.1: on this image Xcode_27.2.app is an alias of a release candidate,
          # and App Store uploads must come from a release Xcode.
          PICK=/Applications/Xcode_27.1.app
          if [ ! -d "$PICK" ]; then
            echo "::error::$PICK is not on this runner image"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$PICK"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "$(printf '%s\n27.1\n' "$SDK" | sort -V | head -n 1)" != "27.1" ]; then
            echo "::error::iOS SDK $SDK is older than 27.1 (needed for iPhone Duo)"; exit 1
          fi
          # Xcode 27 installs the Metal toolchain on demand; the app has Metal shaders.
          xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Install API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      # The archive is built unsigned and signed only at export, with the App Store Connect API key and
      # cloud-managed distribution signing. Signing the archive made Xcode create a new Apple Development
      # certificate on every fresh runner (no private key there), until the account hit its certificate
      # limit and archives failed ("Choose a certificate to revoke"). The app has no entitlements, so
      # nothing is lost by signing at export.
      - name: Archive
        run: |
          set -o pipefail
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project MotionLab.xcodeproj \
            -scheme MotionLab \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MotionLab.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > archive.log 2>&1 || {
              tail -n 40 archive.log
              echo "================ ERRORS ================"
              grep -E "error:|Error" archive.log | sort -u | head -n 60
              exit 1
            }
          echo "Archive succeeded"

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MotionLab.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | tail -n 40
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" export.log || { echo "::error::Export/upload did not succeed"; grep -E "error" export.log | sort -u | head -n 40; exit 1; }
          echo "Uploaded. The build appears in App Store Connect → TestFlight after processing (usually 5–20 min)."

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
